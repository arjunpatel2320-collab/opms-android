# Builds the OPMS Android app (APK) on GitHub's computers.
#  - Every push to main, or "Run workflow" on the Actions tab: the APK is attached to that run (Artifacts).
#  - Publishing a Release (for example tag v1.0.0): the APK is also attached to the Release for download.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="${{ github.event.release.tag_name }}"
            NAME="${NAME#v}"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          echo "OPMS_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "OPMS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Building version $NAME (${{ github.run_number }})"

      - name: Prepare the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OPMS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/opms-signing.p12"
            echo "OPMS_KEYSTORE_FILE=$RUNNER_TEMP/opms-signing.p12" >> "$GITHUB_ENV"
            echo "Signing with your OPMS key."
          else
            echo "::warning::No signing key secrets found, so this APK uses a temporary key. Installing a later build over it will fail until you uninstall the app first. See README: 'Signing key'."
          fi

      - name: Build the APK
        env:
          OPMS_KEYSTORE_PASSWORD: ${{ secrets.OPMS_KEYSTORE_PASSWORD }}
          OPMS_KEY_ALIAS: ${{ secrets.OPMS_KEY_ALIAS }}
          OPMS_KEY_PASSWORD: ${{ secrets.OPMS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OPMS-${OPMS_VERSION_NAME}.apk"
          ls -l dist

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: OPMS-${{ env.OPMS_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach the APK to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
